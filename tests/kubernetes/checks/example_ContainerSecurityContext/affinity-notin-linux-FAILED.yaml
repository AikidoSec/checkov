apiVersion: apps/v1
kind: Deployment
metadata:
  name: affinity-notin-linux-still-fail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notin-linux
  template:
    metadata:
      labels:
        app: notin-linux
    spec:
      containers:
        - name: app
          image: busybox:1.36
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: NotIn
                    values:
                      - linux
