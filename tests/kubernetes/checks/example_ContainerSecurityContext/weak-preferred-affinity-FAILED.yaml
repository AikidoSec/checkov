apiVersion: apps/v1
kind: Deployment
metadata:
  name: preferred-affinity-windows-still-fail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preferred-win
  template:
    metadata:
      labels:
        app: preferred-win
    spec:
      containers:
        - name: app
          image: busybox:1.36
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - windows
