apiVersion: apps/v1
kind: Deployment
metadata:
  name: affinity-os-doesnotexist-still-fail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: os-missing
  template:
    metadata:
      labels:
        app: os-missing
    spec:
      containers:
        - name: app
          image: busybox:1.36
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: DoesNotExist
