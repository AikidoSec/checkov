apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-nodeselector-with-securitycontext
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linux-pass
  template:
    metadata:
      labels:
        app: linux-pass
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: app
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
