apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  annotations:
    force-redeploy: "{{ .Values.timestamp }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: app:1.0.0
